# Lokalny stack DEV (pełny Docker).
# Użycie: docker compose -f docker-compose.dev.yaml up --build
# Wartości sekretów bierz z .env (cp .env.example .env). Domyślne poniżej są bezpieczne lokalnie.

services:
  przyczepki_web:
    container_name: przyczepki_web
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - TZ=${TZ:-Europe/Warsaw}
      - APP_ENV=dev
    networks:
      - przyczepki-network
    restart: unless-stopped
    depends_on:
      - przyczepki_api
    ports:
      - "${WEB_PORT:-80}:80"

  przyczepki_api:
    build:
      context: .
      dockerfile: server/DockerfileServer
    container_name: przyczepki_api
    environment:
      - TZ=${TZ:-Europe/Warsaw}
      - API_ENV=dev
      - DB_HOST=przyczepki_db
      - DB_PORT=${DB_PORT:-27017}
      - DB_NAME=${DB_NAME:-przyczepki}
      - DB_USER=${DB_USER:-dev}
      - DB_PASSWORD=${DB_PASSWORD:-dev}
      - DB_AUTH_SOURCE=${DB_AUTH_SOURCE:-admin}
      - AUTH_SECRET_LOGIN=${AUTH_SECRET_LOGIN:-dev-auth-secret}
      - AUTH_SECRET_REFRESH=${AUTH_SECRET_REFRESH:-dev-refresh-secret}
      - AUTH_ISSUER=${AUTH_ISSUER:-ktor-dev}
      - AUTH_AUDIENCE=${AUTH_AUDIENCE:-ktor-dev}
      - AUTH_REALM=${AUTH_REALM:-ktor-dev}
      - AUTH_ACCESS_TOKEN_EXPIRY=${AUTH_ACCESS_TOKEN_EXPIRY:-3600000}
      - AUTH_REFRESH_TOKEN_EXPIRY=${AUTH_REFRESH_TOKEN_EXPIRY:-2592000000}
      - AUTH_CLAIM=${AUTH_CLAIM:-userId}
      - AUTH_GOOGLE_CLIENT_ID=${AUTH_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - EMAIL_HOST=przyczepki_email
      - EMAIL_PORT=${EMAIL_PORT:-8200}
      - WEB_HOST=${WEB_HOST:-localhost}
      - WEB_PORT=${WEB_PORT:-80}
      - API_HOST=${API_HOST:-localhost}
      - API_PORT=${API_PORT:-8090}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-api-key}
      - PAYMENT_MERCHANT_ID=${PAYMENT_MERCHANT_ID:-0}
      - PAYMENT_POS_ID=${PAYMENT_POS_ID:-0}
      - PAYMENT_SECRET_ID=${PAYMENT_SECRET_ID:-dev-secret}
      - PAYMENT_CRC=${PAYMENT_CRC:-dev-crc}
      - PAYMENT_ENV=${PAYMENT_ENV:-sandbox}
      - PAYMENT_MOCK=${PAYMENT_MOCK:-true}
      - PAYMENT_PUBLIC_BASE=${PAYMENT_PUBLIC_BASE:-https://adelyn-unarrestable-amirah.ngrok-free.dev}
      - PAYMENT_URL_RETURN=${PAYMENT_URL_RETURN:-http://localhost/podsumowanieRezerwacji}
      - PAYMENT_URL_STATUS=${PAYMENT_URL_STATUS:-https://adelyn-unarrestable-amirah.ngrok-free.dev/payment/notification}
      - GATE_OPEN_URL=${GATE_OPEN_URL:-}
      - GATE_OPEN_METHOD=${GATE_OPEN_METHOD:-PATCH}
      - GATE_ACCESS_TOKEN=${GATE_ACCESS_TOKEN:-}
      - GATE_API_KEY=${GATE_API_KEY:-}
      - GATE_REQUEST_BODY=${GATE_REQUEST_BODY:-{"action":"OPEN_CLOSE"}}
      - GATE_MOCK=${GATE_MOCK:-true}
      - GATE_COOLDOWN_SECONDS=${GATE_COOLDOWN_SECONDS:-60}
      - SUPLA_CLIENT_ID=${SUPLA_CLIENT_ID:-${SUPLA_ID:-}}
      - SUPLA_CLIENT_SECRET=${SUPLA_CLIENT_SECRET:-${SUPLA_SECRET:-}}
      - SUPLA_ID=${SUPLA_ID:-}
      - SUPLA_SECRET=${SUPLA_SECRET:-}
      - SUPLA_TOKEN_URL=${SUPLA_TOKEN_URL:-https://svr111.supla.org/oauth/v2/token}
      - SUPLA_REDIRECT_URI=${SUPLA_REDIRECT_URI:-}
      - SUPLA_REFRESH_TOKEN=${SUPLA_REFRESH_TOKEN:-}
      - SUPLA_OAUTH_HELPER=${SUPLA_OAUTH_HELPER:-true}
    networks:
      - przyczepki-network
    restart: unless-stopped
    depends_on:
      - przyczepki_db
    ports:
      - "${API_PORT:-8090}:8090"

  przyczepki_db:
    image: mongo
    container_name: przyczepki_db
    restart: unless-stopped
    networks:
      - przyczepki-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-dev}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-dev}
    ports:
      - "${DB_PORT:-27017}:27017"
    volumes:
      - przyczepki_mongo_data_dev:/data/db

  przyczepki_email:
    image: wilczynski87/przyczepki-email:latest
    container_name: przyczepki_email
    restart: unless-stopped
    networks:
      - przyczepki-network
    environment:
      - EMAIL_ENV=dev
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN:-}
      - GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-api-key}
      - BCC=${BCC:-}
      - EMAIL_PORT=${EMAIL_PORT:-8200}
      - EMAIL_HOST=${EMAIL_HOST:-localhost}
      - API_HOST=przyczepki_api
      - API_PORT=${API_PORT:-8090}
    ports:
      - "${EMAIL_PORT:-8200}:8200"

networks:
  przyczepki-network:
    driver: bridge

volumes:
  przyczepki_mongo_data_dev:
